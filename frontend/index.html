<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a3622" />
    <title>SpendShield — Financial Health Copilot</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind via CDN, with the SpendShield design tokens extended inline.
         THEME NOTE: deep dark green brand palette (#0a3622 or emerald-900). -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Inter", "sans-serif"],
            },
            colors: {
              canvas: "#F4F5F7",
              navy: "#0a3622",
              forest: "#0a3622",
              cardborder: "#E5E7EB",
              accent: "#10B981",
              healthy: "#10B981",
              attention: "#F59E0B",
              risk: "#EF4444",
            },
          },
        },
      };
    </script>
    <style>
      /* Smooth transitions for theme toggle */
      html.dark {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 0;
      }

      /* Motion: content cascades in on load and on every tab switch (React's
         key={activeTab} in App.jsx re-triggers it). Each direct child of
         .tab-enter fades/slides in slightly after the previous one. */
      @keyframes tabIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .tab-enter > * { animation: tabIn 0.45s ease-out both; }
      .tab-enter > *:nth-child(2) { animation-delay: 0.07s; }
      .tab-enter > *:nth-child(3) { animation-delay: 0.14s; }
      .tab-enter > *:nth-child(4) { animation-delay: 0.21s; }
      .tab-enter > *:nth-child(5) { animation-delay: 0.28s; }
      @media (prefers-reduced-motion: reduce) {
        .tab-enter > * { animation: none; }
      }

      /* Table headers: soft green tint instead of flat grey. */
      main thead.bg-canvas {
        background: linear-gradient(90deg, rgba(16, 185, 129, 0.12), rgba(13, 148, 136, 0.06));
      }

      /* Small polish: brand-coloured text selection + slim green scrollbar. */
      ::selection { background: rgba(16, 185, 129, 0.28); }
      * { scrollbar-width: thin; scrollbar-color: rgba(29, 96, 76, 0.35) transparent; }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-thumb { background: rgba(29, 96, 76, 0.35); border-radius: 999px; }
      *::-webkit-scrollbar-track { background: transparent; }
      .no-scrollbar::-webkit-scrollbar, .scrollbar-none::-webkit-scrollbar { display: none; }
      .no-scrollbar, .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
      /* Ultra-thin elegant scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.25); border-radius: 9999px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.5); }
      .custom-scrollbar { scrollbar-width: thin; scrollbar-color: rgba(16, 185, 129, 0.25) transparent; }
    </style>
  </head>
  <body class="bg-[#F2F9F6] dark:bg-[#061d12] text-[#18191B] dark:text-zinc-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
